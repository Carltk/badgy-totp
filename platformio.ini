[platformio]
default_envs = badgy

; Shared by both hardware revisions: ESP-12, 4 MB flash, 2.9" e-paper, CP2104 USB-UART.
; PlatformIO auto-detects the serial port; pass --upload-port COMx (or /dev/ttyUSBx) to override.
[badgy_common]
platform = espressif8266
board = nodemcuv2
framework = arduino
; GPIO10 is the "up" button, so the flash must run in DIO mode (QIO claims GPIO9/10).
board_build.flash_mode = dio
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld
upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder
lib_deps =
  zinggjm/GxEPD @ ^3.1.3
  adafruit/Adafruit GFX Library @ ^1.11.9
  tzapu/WiFiManager @ ^2.0.17
  bblanchon/ArduinoJson @ ^7.2.0
test_ignore = *

; Badgy Rev 2B and older: GDEH029A1 panel. Tested.
[env:badgy]
extends = badgy_common

; Badgy Rev 2C (closed asterisk jumper on the back, green tab on the screen film): GDEW029T5
; panel. Builds, but untested on hardware.
[env:badgy_rev2c]
extends = badgy_common
build_flags = -D BADGY_REV2C

[env:native]
platform = native
build_flags = -std=gnu++17
test_build_src = no
